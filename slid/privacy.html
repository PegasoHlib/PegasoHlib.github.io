<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slid — Privacy</title>
<meta name="description" content="How the Slid timeline app handles your data: it stays on your phone.">
<link rel="stylesheet" href="site.css">
<style>
.promises{margin:24px 0 0}
.promises .tile{display:flex;gap:14px;align-items:flex-start}
.promises .tile .ic{margin:0}
.toc{margin-top:18px;padding:6px}
.toc h2{font-size:15px;font-weight:650;color:var(--ink3);margin:10px 12px 4px;text-transform:none}
.toc ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr}
@media (min-width:640px){.toc ol{grid-template-columns:1fr 1fr}}
.toc a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--ink)}
.toc a:hover{background:var(--bg)}
.toc a .ic{width:32px;height:32px;border-radius:10px}
.toc a .t{flex:1;line-height:1.3}
.toc a .go{color:var(--ink3)}
section.card{padding:20px 20px 8px;margin-top:14px}
section h2{display:flex;align-items:center;gap:12px;font-size:19px;line-height:1.3;margin:0 0 10px}
section p,section li{color:var(--ink2)}
section ul{padding-left:20px;margin:0 0 12px}
section li{margin:6px 0}
section li b,section p b{color:var(--ink)}
.opt{display:inline-block;font-size:12px;font-weight:600;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink3);text-decoration:none;margin:0 0 12px}
@media (max-width:420px){section.card{padding:16px 16px 6px}}
</style>
</head>

    { id: "data", icon: "pin", title: "What data the app holds", html: `<ul>

    { id: "files", icon: "file", title: "Backup files and safety copies", html: `<p>A backup file is created only when you save one yourself, in the place you choose. Before a backup replaces your timeline, the app keeps the previous timeline on the device (the last three), so a wrong restore can be undone; these copies never leave the phone.</p>` },

<li><b>Transportes públicos</b> <span class="opt">{opt}</span>. Para distinguir um autocarro, um elétrico, um comboio ou o metro, o percurso de uma viagem terminada de veículo é enviado ao serviço Overpass do OpenStreetMap, que responde com as linhas e as paragens ao longo dele. Não é enviado com ele nada que permita identificar a pessoa. Pode desativar isto nas definições.</li>
</ul>` },
    { id: "drive", icon: "cloud", title: "Cópia no Google Drive", opt: true, html: `<p>Se ligar o Google Drive, a app só tem acesso à sua própria pasta oculta no seu Drive (a permissão drive.appdata) e não consegue ver nenhum dos seus outros ficheiros. É lá guardada uma cópia da sua cronologia, uma por dispositivo, para poder ser restaurada num telemóvel novo ou mostrada num tablet. O Google Drive pode guardar durante algum tempo versões anteriores dessa cópia, que a app pode restaurar. A app também lê o seu endereço de email, apenas para mostrar que conta está ligada. Estes dados circulam apenas entre o seu dispositivo e a Google; o programador não tem acesso a eles. Pode desligar o Drive nas definições.</p>
<p>A utilização pela app das informações recebidas das APIs da Google cumpre a Google API Services User Data Policy, incluindo os requisitos de Limited Use.</p>` },
    { id: "health", icon: "heart", title: "Dados do relógio através do Health Connect", opt: true, html: `<p>Se permitir, a app lê do Health Connect os passos, a frequência cardíaca, o sono e os treinos (com os percursos), que lá são escritos por apps de relógios como o Mi Fitness. Apenas lê estes dados e nunca escreve no Health Connect. Os dados são lidos no telemóvel só para os mostrar no separador «Saúde» e no dia correspondente da sua cronologia; a app não os guarda na sua base de dados, não os inclui nas cópias e não os envia para lado nenhum. Pode retirar as permissões a qualquer momento nas definições do Health Connect.</p>` },
    { id: "files", icon: "file", title: "Ficheiros de cópia e cópias de segurança", html: `<p>Um ficheiro de cópia só é criado quando é você a guardá-lo, no local que escolher. Antes de uma cópia substituir a sua cronologia, a app guarda a cronologia anterior no dispositivo (as últimas três), para que um restauro errado possa ser desfeito; estas cópias nunca saem do telemóvel.</p>` },
    { id: "delete", icon: "trash", title: "Apagar dados", html: `<p>Qualquer registo pode ser apagado na cronologia. Desinstale a app e todos os dados no dispositivo desaparecem. A cópia no Google Drive pode ser apagada na app ou em «Gerir aplicações», nas definições do Google Drive.</p>` },
    { id: "children", icon: "child", title: "Crianças", html: `<p>A app não recolhe dados sobre ninguém, incluindo crianças: tudo fica no dispositivo do proprietário.</p>` },
    { id: "changes", icon: "edit", title: "Alterações", html: `<p>Se esta política mudar, a nova versão aparecerá nesta página com uma nova data.</p>` },
    { id: "contact", icon: "mail", title: "Contacto", html: `<p>Perguntas sobre privacidade: {mail}</p>` },
  ],
},
fr: {
  name: "Français", app: "Slid", title: "Politique de confidentialité",
  date: "L’app « Slid » (paquet dev.slid). En vigueur depuis le 21 octobre 2026.",
  lead: "Slid n’a ni serveurs à lui, ni comptes, ni publicité, ni statistiques d’usage. Votre chronologie reste sur votre téléphone, et le développeur ne la reçoit ni ne la voit jamais.",
  cards: [
    ["phone", "Reste sur votre téléphone", "La chronologie, les lieux et la position des photos sont stockés uniquement sur l’appareil."],
    ["off", "Rien sur vous n’est envoyé", "Pas de compte, pas de suivi, pas de publicité, pas de statistiques."],
    ["hand", "Vous décidez", "Chaque autorisation et chaque fonction en ligne est facultative et peut être désactivée."],
    ["trash", "Facile à supprimer", "Supprimez n’importe quelle entrée, ou désinstallez l’app et tout disparaît."],
  ],
  toc: "Sur cette page", optional: "facultatif",
  sections: [
    { id: "data", icon: "pin", title: "Quelles données l’app contient", html: `<ul>
<li><b>Position.</b> Tant que l’enregistrement est activé, l’app enregistre la position du téléphone (y compris en arrière-plan) pour montrer vos lieux et vos trajets.</li>
<li><b>Activité physique.</b> Si vous l’autorisez, Android indique à l’app si vous marchez, êtes à vélo ou dans un véhicule. Cela sert uniquement à reconnaître le moyen de transport.</li>
<li><b>Photos et vidéos.</b> Si vous l’autorisez, l’app lit la date et le lieu enregistrés dans les fichiers de votre galerie pour afficher les photos sur la carte. Les images ne sont ni copiées ni envoyées nulle part. L’app n’écrit rien dans vos photos ; elle peut seulement retirer un lieu écrit par une ancienne version, après qu’Android vous l’a demandé.</li>
<li><b>Fichiers importés.</b> Les fichiers de vos trajets Google ou de Google Takeout que vous choisissez sont lus sur le téléphone.</li>
<li><b>Lieux et réglages :</b> les noms que vous donnez aux lieux, la langue, le thème.</li>
</ul><p>Tout cela est stocké sur votre appareil.</p>` },
    { id: "internet", icon: "globe", title: "Ce qui passe par internet", html: `<ul>
<li><b>Cartes.</b> Les tuiles de la carte sont chargées depuis OpenFreeMap (données OpenStreetMap), et les images satellite depuis Esri. Ces serveurs voient quelle zone est affichée, pas qui vous êtes.</li>
<li><b>Adresses et noms de lieux</b> <span class="opt">{opt}</span>. Les coordonnées des lieux de vos arrêts sont envoyées au service d’adresses d’Android et à Nominatim (OpenStreetMap) pour obtenir une adresse et un nom. Rien qui vous identifie n’est envoyé avec. Cela peut être désactivé dans les paramètres.</li>
<li><b>Transports en commun</b> <span class="opt">{opt}</span>. Pour distinguer un bus, un tram, un train ou un métro, le parcours d’un trajet terminé en véhicule est envoyé au service Overpass d’OpenStreetMap, qui répond avec les voies et les arrêts le long de ce parcours. Rien qui vous identifie n’est envoyé avec. Cela peut être désactivé dans les paramètres.</li>
</ul>` },
    { id: "drive", icon: "cloud", title: "Sauvegarde sur Google Drive", opt: true, html: `<p>Si vous connectez Google Drive, l’app n’a accès qu’à son propre dossier caché dans votre Drive (l’autorisation drive.appdata) et ne peut voir aucun de vos autres fichiers. Une copie de votre chronologie y est écrite, une par appareil, pour pouvoir la restaurer sur un nouveau téléphone ou l’afficher sur une tablette. Google Drive peut conserver un temps des versions précédentes de cette copie, que l’app sait restaurer. L’app lit aussi votre adresse e-mail, uniquement pour afficher le compte connecté. Ces données circulent seulement entre votre appareil et Google ; le développeur n’y a pas accès. Vous pouvez déconnecter Drive dans les paramètres.</p>
<p>L’utilisation par l’app des informations reçues des API Google respecte la Google API Services User Data Policy, y compris les exigences de Limited Use.</p>` },
    { id: "health", icon: "heart", title: "Données de la montre via Health Connect", opt: true, html: `<p>Si vous l’autorisez, l’app lit dans Health Connect les pas, la fréquence cardiaque, le sommeil et les entraînements (avec leurs parcours), qu’y écrivent des apps de montres comme Mi Fitness. Elle lit seulement ces données et n’écrit jamais dans Health Connect. Les données sont lues sur le téléphone uniquement pour les afficher dans l’onglet « Santé » et au jour correspondant de votre chronologie ; l’app ne les stocke pas dans sa base de données, ne les inclut pas dans les sauvegardes et ne les envoie nulle part. Vous pouvez retirer les autorisations à tout moment dans les paramètres de Health Connect.</p>` },
    { id: "files", icon: "file", title: "Fichiers de sauvegarde et copies de sécurité", html: `<p>Un fichier de sauvegarde n’est créé que lorsque vous l’enregistrez vous-même, à l’endroit choisi. Avant qu’une sauvegarde remplace votre chronologie, l’app garde la chronologie précédente sur l’appareil (les trois dernières), pour qu’une restauration erronée puisse être annulée ; ces copies ne quittent jamais le téléphone.</p>` },
    { id: "delete", icon: "trash", title: "Supprimer les données", html: `<p>N’importe quelle entrée peut être supprimée dans la chronologie. Désinstallez l’app, et toutes les données de l’appareil disparaissent. La copie sur Google Drive peut être supprimée dans l’app, ou dans « Gérer les applications » des paramètres de Google Drive.</p>` },
    { id: "children", icon: "child", title: "Enfants", html: `<p>L’app ne collecte de données sur personne, y compris les enfants : tout reste sur l’appareil de son propriétaire.</p>` },
    { id: "changes", icon: "edit", title: "Modifications", html: `<p>Si cette politique change, la nouvelle version apparaîtra sur cette page avec une nouvelle date.</p>` },
    { id: "contact", icon: "mail", title: "Contact", html: `<p>Questions sur la confidentialité : {mail}</p>` },
  ],
},
de: {
  name: "Deutsch", app: "Slid", title: "Datenschutzerklärung",
  date: "Die App „Slid“ (Paket dev.slid). Gültig ab 21. Oktober 2026.",
  lead: "Slid hat keine eigenen Server, keine Konten, keine Werbung und keine Analyse. Deine Zeitachse liegt auf deinem Handy, und der Entwickler bekommt oder sieht sie nie.",
  cards: [
    ["phone", "Bleibt auf deinem Handy", "Zeitachse, Orte und die Orte der Fotos werden nur auf dem Gerät gespeichert."],
    ["off", "Nichts über dich wird gesendet", "Keine Konten, kein Tracking, keine Werbung, keine Analyse."],
    ["hand", "Du entscheidest", "Jede Berechtigung und jede Online-Funktion ist optional und lässt sich ausschalten."],
    ["trash", "Leicht zu löschen", "Lösche jeden Eintrag, oder deinstalliere die App, und alles ist weg."],
  ],
  toc: "Auf dieser Seite", optional: "optional",
  sections: [
    { id: "data", icon: "pin", title: "Welche Daten die App hat", html: `<ul>
<li><b>Standort.</b> Solange die Aufzeichnung eingeschaltet ist, zeichnet die App den Standort des Handys auf (auch im Hintergrund), um zu zeigen, wo du warst und wie du unterwegs warst.</li>
<li><b>Körperliche Aktivität.</b> Wenn du es erlaubst, teilt Android der App mit, ob du gehst, Rad fährst oder in einem Fahrzeug bist. Das dient nur dazu, die Art der Fortbewegung zu erkennen.</li>
<li><b>Fotos und Videos.</b> Wenn du es erlaubst, liest die App Datum und Ort aus den Dateien deiner Galerie, um Fotos auf der Karte zu zeigen. Die Bilder werden nicht kopiert und nirgendwohin gesendet. Die App schreibt nichts in deine Fotos; sie kann nur einen Ort entfernen, den eine ältere Version hineingeschrieben hat, nachdem Android dich gefragt hat.</li>
<li><b>Importierte Dateien.</b> Dateien aus der Google Zeitachse oder Google Takeout, die du auswählst, werden auf dem Handy gelesen.</li>
<li><b>Orte und Einstellungen:</b> die Namen, die du Orten gibst, Sprache, Design.</li>
</ul><p>All das wird auf deinem Gerät gespeichert.</p>` },
    { id: "internet", icon: "globe", title: "Was über das Internet geht", html: `<ul>
<li><b>Karten.</b> Kartenkacheln werden von OpenFreeMap (Daten von OpenStreetMap) geladen, Satellitenbilder von Esri. Diese Server sehen, welches Gebiet gezeigt wird, nicht wer du bist.</li>
<li><b>Adressen und Ortsnamen</b> <span class="opt">{opt}</span>. Die Koordinaten der Orte, an denen du angehalten hast, werden an den Adressdienst von Android und an Nominatim (OpenStreetMap) gesendet, um Adresse und Namen zu erhalten. Nichts, was dich identifiziert, wird mitgesendet. Das lässt sich in den Einstellungen ausschalten.</li>
<li><b>Öffentlicher Verkehr</b> <span class="opt">{opt}</span>. Um Bus, Tram, Zug oder U-Bahn zu unterscheiden, wird die Route einer beendeten Fahrt mit einem Fahrzeug an den Overpass-Dienst von OpenStreetMap gesendet, der mit den Gleisen und Haltestellen entlang der Route antwortet. Nichts, was dich identifiziert, wird mitgesendet. Das lässt sich in den Einstellungen ausschalten.</li>
</ul>` },
    { id: "drive", icon: "cloud", title: "Sicherung in Google Drive", opt: true, html: `<p>Wenn du Google Drive verbindest, erhält die App nur Zugriff auf ihren eigenen versteckten Ordner in deinem Drive (die Berechtigung drive.appdata) und kann keine deiner anderen Dateien sehen. Dort wird eine Kopie deiner Zeitachse abgelegt, eine pro Gerät, damit sie auf einem neuen Handy wiederhergestellt oder auf einem Tablet angezeigt werden kann. Google Drive kann ältere Versionen dieser Kopie eine Zeit lang aufbewahren, die die App wiederherstellen kann. Die App liest außerdem deine E-Mail-Adresse, nur um zu zeigen, welches Konto verbunden ist. Diese Daten gehen nur zwischen deinem Gerät und Google hin und her; der Entwickler hat keinen Zugriff darauf. Du kannst Drive in den Einstellungen trennen.</p>
<p>Die Nutzung von Informationen, die die App über Google-APIs erhält, entspricht der Google API Services User Data Policy, einschließlich der Anforderungen an Limited Use.</p>` },
    { id: "health", icon: "heart", title: "Uhrdaten über Health Connect", opt: true, html: `<p>Wenn du es erlaubst, liest die App Schritte, Herzfrequenz, Schlaf und Trainings (mit ihren Routen) aus Health Connect, wohin Uhren-Apps wie Mi Fitness sie schreiben. Sie liest diese Daten nur und schreibt nie in Health Connect. Die Daten werden auf dem Handy nur gelesen, um sie im Tab „Gesundheit“ und am passenden Tag deiner Zeitachse zu zeigen; die App speichert sie nicht in ihrer Datenbank, nimmt sie nicht in Sicherungen auf und sendet sie nirgendwohin. Du kannst die Berechtigungen jederzeit in den Einstellungen von Health Connect widerrufen.</p>` },
    { id: "files", icon: "file", title: "Sicherungsdateien und Sicherheitskopien", html: `<p>Eine Sicherungsdatei entsteht nur, wenn du selbst eine speicherst, an dem Ort, den du wählst. Bevor eine Sicherung deine Zeitachse ersetzt, behält die App die vorherige Zeitachse auf dem Gerät (die letzten drei), damit sich eine falsche Wiederherstellung rückgängig machen lässt; diese Kopien verlassen das Handy nie.</p>` },
    { id: "delete", icon: "trash", title: "Daten löschen", html: `<p>Jeder Eintrag lässt sich in der Zeitachse löschen. Deinstallierst du die App, sind alle Daten auf dem Gerät weg. Die Kopie in Google Drive kann in der App gelöscht werden oder in den Einstellungen von Google Drive unter „Apps verwalten“.</p>` },
    { id: "children", icon: "child", title: "Kinder", html: `<p>Die App erhebt über niemanden Daten, auch nicht über Kinder: Alles bleibt auf dem Gerät der Person, der es gehört.</p>` },
    { id: "changes", icon: "edit", title: "Änderungen", html: `<p>Ändert sich diese Erklärung, erscheint die neue Fassung auf dieser Seite mit neuem Datum.</p>` },
    { id: "contact", icon: "mail", title: "Kontakt", html: `<p>Fragen zum Datenschutz: {mail}</p>` },
  ],
},
it: {
  name: "Italiano", app: "Slid", title: "Informativa sulla privacy",
  date: "L’app «Slid» (pacchetto dev.slid). In vigore dal 21 ottobre 2026.",
  lead: "Slid non ha server propri, account, pubblicità né analisi. La tua cronologia vive sul tuo telefono, e lo sviluppatore non la riceve né la vede mai.",
  cards: [
    ["phone", "Resta sul tuo telefono", "La cronologia, i luoghi e la posizione delle foto sono salvati solo sul dispositivo."],
    ["off", "Niente su di te viene inviato", "Nessun account, nessun tracciamento, nessuna pubblicità, nessuna analisi."],
    ["hand", "Decidi tu", "Ogni autorizzazione e ogni funzione online è facoltativa e si può disattivare."],
    ["trash", "Facile da eliminare", "Elimina qualsiasi voce, oppure disinstalla l’app e sparisce tutto."],
  ],
  toc: "In questa pagina", optional: "facoltativo",
  sections: [
    { id: "data", icon: "pin", title: "Quali dati contiene l’app", html: `<ul>
<li><b>Posizione.</b> Finché tieni attiva la registrazione, l’app registra la posizione del telefono (anche in background) per mostrare i luoghi visitati e i tuoi spostamenti.</li>
<li><b>Attività fisica.</b> Se lo consenti, Android dice all’app se stai camminando, pedalando o viaggiando in un veicolo. Serve solo a capire il mezzo di trasporto.</li>
<li><b>Foto e video.</b> Se lo consenti, l’app legge la data e il luogo salvati nei file della galleria per mostrare le foto sulla mappa. Le immagini non vengono copiate né inviate da nessuna parte. L’app non scrive nulla nelle tue foto; può solo togliere un luogo scritto da una versione precedente, dopo che Android te lo ha chiesto.</li>
<li><b>File importati.</b> I file degli Spostamenti di Google o di Google Takeout che scegli vengono letti sul telefono.</li>
<li><b>Luoghi e impostazioni:</b> i nomi che dai ai luoghi, la lingua, il tema.</li>
</ul><p>Tutto questo è salvato sul tuo dispositivo.</p>` },
    { id: "internet", icon: "globe", title: "Cosa passa da internet", html: `<ul>
<li><b>Mappe.</b> I riquadri della mappa vengono caricati da OpenFreeMap (dati OpenStreetMap) e le immagini satellitari da Esri. Questi server vedono quale zona è mostrata, non chi sei.</li>
<li><b>Indirizzi e nomi dei luoghi</b> <span class="opt">{opt}</span>. Le coordinate dei luoghi delle tue soste vengono inviate al servizio indirizzi di Android e a Nominatim (OpenStreetMap) per ottenere un indirizzo e un nome. Con esse non viene inviato nulla che ti identifichi. Si può disattivare nelle impostazioni.</li>
<li><b>Mezzi pubblici</b> <span class="opt">{opt}</span>. Per distinguere autobus, tram, treno o metro, il percorso di un viaggio in veicolo concluso viene inviato al servizio Overpass di OpenStreetMap, che risponde con i binari e le fermate lungo il percorso. Con esso non viene inviato nulla che ti identifichi. Si può disattivare nelle impostazioni.</li>
</ul>` },
    { id: "drive", icon: "cloud", title: "Backup su Google Drive", opt: true, html: `<p>Se colleghi Google Drive, l’app ottiene accesso solo alla propria cartella nascosta nel tuo Drive (l’autorizzazione drive.appdata) e non può vedere nessuno degli altri tuoi file. Lì viene scritta una copia della tua cronologia, una per dispositivo, così da poterla ripristinare su un telefono nuovo o mostrarla su un tablet. Google Drive può conservare per un po’ versioni precedenti di questa copia, che l’app sa ripristinare. L’app legge anche il tuo indirizzo email, solo per mostrare quale account è collegato. Questi dati viaggiano solo tra il tuo dispositivo e Google; lo sviluppatore non vi ha accesso. Puoi scollegare Drive nelle impostazioni.</p>
<p>L’uso da parte dell’app delle informazioni ricevute dalle API di Google rispetta la Google API Services User Data Policy, compresi i requisiti di Limited Use.</p>` },
    { id: "health", icon: "heart", title: "Dati dell’orologio tramite Health Connect", opt: true, html: `<p>Se lo consenti, l’app legge da Health Connect passi, frequenza cardiaca, sonno e allenamenti (con i loro percorsi), scritti lì da app per orologi come Mi Fitness. Legge soltanto questi dati e non scrive mai in Health Connect. I dati vengono letti sul telefono solo per mostrarli nella scheda «Salute» e nel giorno corrispondente della cronologia; l’app non li salva nel suo database, non li include nei backup e non li invia da nessuna parte. Puoi revocare le autorizzazioni in qualsiasi momento nelle impostazioni di Health Connect.</p>` },
    { id: "files", icon: "file", title: "File di backup e copie di sicurezza", html: `<p>Un file di backup viene creato solo quando lo salvi tu, nel posto che scegli. Prima che un backup sostituisca la tua cronologia, l’app conserva la cronologia precedente sul dispositivo (le ultime tre), così un ripristino sbagliato si può annullare; queste copie non lasciano mai il telefono.</p>` },
    { id: "delete", icon: "trash", title: "Eliminare i dati", html: `<p>Qualsiasi voce si può eliminare nella cronologia. Disinstalla l’app e tutti i dati sul dispositivo spariscono. La copia su Google Drive si può eliminare nell’app oppure in «Gestisci app» nelle impostazioni di Google Drive.</p>` },
    { id: "children", icon: "child", title: "Minori", html: `<p>L’app non raccoglie dati su nessuno, compresi i minori: tutto resta sul dispositivo di chi lo possiede.</p>` },
    { id: "changes", icon: "edit", title: "Modifiche", html: `<p>Se questa informativa cambia, la nuova versione comparirà su questa pagina con una nuova data.</p>` },
    { id: "contact", icon: "mail", title: "Contatti", html: `<p>Domande sulla privacy: {mail}</p>` },
  ],
},
sv: {
  name: "Svenska", app: "Slid", title: "Integritetspolicy",
  date: "Appen ”Slid” (paket dev.slid). Gäller från 21 oktober 2026.",
  lead: "Slid har inga egna servrar, inga konton, ingen reklam och ingen analys. Din tidslinje finns på din telefon, och utvecklaren tar aldrig emot eller ser den.",
  cards: [
    ["phone", "Stannar på din telefon", "Tidslinjen, platserna och fotonas platser sparas bara på enheten."],
    ["off", "Inget om dig skickas", "Inga konton, ingen spårning, ingen reklam, ingen analys."],
    ["hand", "Du bestämmer", "Varje behörighet och varje onlinefunktion är valfri och kan stängas av."],
    ["trash", "Lätt att radera", "Radera vilken post som helst, eller avinstallera appen så är allt borta."],
  ],
  toc: "På den här sidan", optional: "valfritt",
  sections: [
    { id: "data", icon: "pin", title: "Vilka data appen har", html: `<ul>
<li><b>Plats.</b> Så länge inspelningen är på registrerar appen telefonens plats (även i bakgrunden) för att visa var du har varit och hur du har tagit dig fram.</li>
<li><b>Fysisk aktivitet.</b> Om du tillåter det talar Android om för appen om du går, cyklar eller åker i ett fordon. Det används bara för att avgöra hur du har tagit dig fram.</li>
<li><b>Foton och videor.</b> Om du tillåter det läser appen datum och plats som finns sparade i galleriets filer för att visa foton på kartan. Bilderna kopieras inte och skickas ingenstans. Appen skriver ingenting i dina foton; den kan bara ta bort en plats som en äldre version skrev in, efter att Android har frågat dig.</li>
<li><b>Importerade filer.</b> Filer från Google Tidslinje eller Google Takeout som du väljer läses på telefonen.</li>
<li><b>Platser och inställningar:</b> namnen du ger platser, språk, tema.</li>
</ul><p>Allt detta sparas på din enhet.</p>` },
    { id: "internet", icon: "globe", title: "Vad som går via internet", html: `<ul>
<li><b>Kartor.</b> Kartrutor hämtas från OpenFreeMap (data från OpenStreetMap) och satellitbilder från Esri. Dessa servrar ser vilket område som visas, inte vem du är.</li>
<li><b>Adresser och platsnamn</b> <span class="opt">{opt}</span>. Koordinaterna för platser där du har stannat skickas till Androids adresstjänst och till Nominatim (OpenStreetMap) för att få en adress och ett namn. Inget som identifierar dig skickas med. Det kan stängas av i inställningarna.</li>
<li><b>Kollektivtrafik</b> <span class="opt">{opt}</span>. För att skilja på buss, spårvagn, tåg och tunnelbana skickas rutten för en avslutad resa med fordon till OpenStreetMaps tjänst Overpass, som svarar med spår och hållplatser längs den. Inget som identifierar dig skickas med. Det kan stängas av i inställningarna.</li>
</ul>` },
    { id: "drive", icon: "cloud", title: "Säkerhetskopia på Google Drive", opt: true, html: `<p>Om du ansluter Google Drive får appen bara åtkomst till sin egen dolda mapp i din Drive (behörigheten drive.appdata) och kan inte se några av dina andra filer. Där sparas en kopia av din tidslinje, en per enhet, så att den kan återställas på en ny telefon eller visas på en surfplatta. Google Drive kan spara äldre versioner av kopian en tid, och appen kan återställa dem. Appen läser också din e-postadress, bara för att visa vilket konto som är anslutet. Dessa data går bara mellan din enhet och Google; utvecklaren har ingen åtkomst till dem. Du kan koppla från Drive i inställningarna.</p>
<p>Appens användning av information från Googles API:er följer Google API Services User Data Policy, inklusive kraven på Limited Use.</p>` },
    { id: "health", icon: "heart", title: "Klockdata via Health Connect", opt: true, html: `<p>Om du tillåter det läser appen steg, puls, sömn och träningspass (med rutter) från Health Connect, dit klockappar som Mi Fitness skriver dem. Den läser bara dessa data och skriver aldrig till Health Connect. Uppgifterna läses på telefonen enbart för att visas på fliken ”Hälsa” och på motsvarande dag i tidslinjen; appen sparar dem inte i sin databas, tar inte med dem i säkerhetskopior och skickar dem ingenstans. Du kan när som helst återkalla behörigheterna i inställningarna för Health Connect.</p>` },
    { id: "files", icon: "file", title: "Säkerhetskopior och reservkopior", html: `<p>En säkerhetskopia skapas bara när du själv sparar en, på den plats du väljer. Innan en säkerhetskopia ersätter din tidslinje behåller appen den tidigare tidslinjen på enheten (de tre senaste), så att en felaktig återställning kan ångras; dessa kopior lämnar aldrig telefonen.</p>` },
    { id: "delete", icon: "trash", title: "Radera data", html: `<p>Varje post kan raderas i tidslinjen. Avinstallera appen så försvinner alla data på enheten. Kopian på Google Drive kan raderas i appen eller under ”Hantera appar” i inställningarna för Google Drive.</p>` },
    { id: "children", icon: "child", title: "Barn", html: `<p>Appen samlar inte in data om någon, inte heller om barn: allt stannar på ägarens enhet.</p>` },
    { id: "changes", icon: "edit", title: "Ändringar", html: `<p>Om policyn ändras visas den nya versionen på den här sidan med ett nytt datum.</p>` },
    { id: "contact", icon: "mail", title: "Kontakt", html: `<p>Frågor om integritet: {mail}</p>` },
  ],
},
id: {
  name: "Bahasa Indonesia", app: "Slid", title: "Kebijakan privasi",
  date: "Aplikasi “Slid” (paket dev.slid). Berlaku sejak 21 Oktober 2026.",
  lead: "Slid tidak punya server sendiri, akun, iklan, maupun analitik. Linimasa tersimpan di ponsel, dan pengembang tidak pernah menerima atau melihatnya.",
  cards: [
    ["phone", "Tetap di ponsel", "Linimasa, tempat, dan lokasi foto hanya disimpan di perangkat."],
    ["off", "Tidak ada data pribadi yang dikirim", "Tanpa akun, tanpa pelacakan, tanpa iklan, tanpa analitik."],
    ["hand", "Kendali ada pada pengguna", "Setiap izin dan setiap fitur online bersifat opsional dan dapat dimatikan."],
    ["trash", "Mudah dihapus", "Hapus entri mana pun, atau copot aplikasinya dan semuanya hilang."],
  ],
  toc: "Di halaman ini", optional: "opsional",
  sections: [
    { id: "data", icon: "pin", title: "Data apa yang disimpan aplikasi", html: `<ul>
<li><b>Lokasi.</b> Selama perekaman aktif, aplikasi mencatat lokasi ponsel (juga di latar belakang) untuk menunjukkan tempat yang pernah dikunjungi dan cara perjalanannya.</li>
<li><b>Aktivitas fisik.</b> Jika diizinkan, Android memberi tahu aplikasi apakah sedang berjalan, bersepeda, atau di dalam kendaraan. Ini hanya dipakai untuk mengetahui cara perjalanan.</li>
<li><b>Foto dan video.</b> Jika diizinkan, aplikasi membaca tanggal dan tempat yang tersimpan di file galeri untuk menampilkan foto di peta. Gambarnya tidak disalin atau dikirim ke mana pun. Aplikasi tidak menulis apa pun ke foto; aplikasi hanya dapat menghapus lokasi yang ditulis versi lama, setelah Android meminta izin.</li>
<li><b>File yang diimpor.</b> File Linimasa Google atau Google Takeout yang dipilih dibaca di ponsel.</li>
<li><b>Tempat dan pengaturan:</b> nama yang diberikan untuk tempat, bahasa, tema.</li>
</ul><p>Semua ini disimpan di perangkat.</p>` },
    { id: "internet", icon: "globe", title: "Apa yang dikirim lewat internet", html: `<ul>
<li><b>Peta.</b> Petak peta dimuat dari OpenFreeMap (data OpenStreetMap), dan citra satelit dari Esri. Server ini melihat area yang ditampilkan, bukan siapa penggunanya.</li>
<li><b>Alamat dan nama tempat</b> <span class="opt">{opt}</span>. Koordinat tempat persinggahan dikirim ke layanan alamat Android dan ke Nominatim (OpenStreetMap) untuk mendapatkan alamat dan nama. Tidak ada data identitas yang ikut dikirim. Fitur ini dapat dimatikan di pengaturan.</li>
<li><b>Transportasi umum</b> <span class="opt">{opt}</span>. Untuk membedakan bus, trem, kereta, atau MRT, rute perjalanan kendaraan yang sudah selesai dikirim ke layanan Overpass dari OpenStreetMap, yang menjawab dengan rel dan halte di sepanjang rute itu. Tidak ada data identitas yang ikut dikirim. Fitur ini dapat dimatikan di pengaturan.</li>
</ul>` },
    { id: "drive", icon: "cloud", title: "Cadangan ke Google Drive", opt: true, html: `<p>Jika Google Drive dihubungkan, aplikasi hanya mendapat akses ke folder tersembunyinya sendiri di Drive (izin drive.appdata) dan tidak dapat melihat file lain. Salinan linimasa ditulis di sana, satu per perangkat, agar dapat dipulihkan di ponsel baru atau ditampilkan di tablet. Google Drive dapat menyimpan versi lama salinan itu untuk sementara, dan aplikasi dapat memulihkannya. Aplikasi juga membaca alamat email, hanya untuk menunjukkan akun yang terhubung. Data ini hanya berpindah antara perangkat dan Google; pengembang tidak memiliki akses ke sana. Drive dapat diputuskan di pengaturan.</p>
<p>Penggunaan informasi yang diterima aplikasi dari Google API mematuhi Google API Services User Data Policy, termasuk persyaratan Limited Use.</p>` },
    { id: "health", icon: "heart", title: "Data jam tangan melalui Health Connect", opt: true, html: `<p>Jika diizinkan, aplikasi membaca langkah, detak jantung, tidur, dan olahraga (beserta rutenya) dari Health Connect, yang ditulis ke sana oleh aplikasi jam tangan seperti Mi Fitness. Aplikasi hanya membaca data ini dan tidak pernah menulis ke Health Connect. Data dibaca di ponsel hanya untuk ditampilkan di tab “Kesehatan” dan pada hari yang sesuai di linimasa; aplikasi tidak menyimpannya di basis datanya, tidak memasukkannya ke cadangan, dan tidak mengirimnya ke mana pun. Izin dapat dicabut kapan saja di pengaturan Health Connect.</p>` },
    { id: "files", icon: "file", title: "File cadangan dan salinan pengaman", html: `<p>File cadangan hanya dibuat saat disimpan sendiri, di tempat yang dipilih. Sebelum cadangan menggantikan linimasa, aplikasi menyimpan linimasa sebelumnya di perangkat (tiga terakhir), agar pemulihan yang keliru dapat dibatalkan; salinan ini tidak pernah meninggalkan ponsel.</p>` },
    { id: "delete", icon: "trash", title: "Menghapus data", html: `<p>Entri mana pun dapat dihapus di linimasa. Copot aplikasinya dan semua data di perangkat hilang. Salinan di Google Drive dapat dihapus di aplikasi, atau di “Kelola aplikasi” pada pengaturan Google Drive.</p>` },
    { id: "children", icon: "child", title: "Anak-anak", html: `<p>Aplikasi tidak mengumpulkan data tentang siapa pun, termasuk anak-anak: semuanya tetap di perangkat pemiliknya.</p>` },
    { id: "changes", icon: "edit", title: "Perubahan", html: `<p>Jika kebijakan ini berubah, versi barunya akan muncul di halaman ini dengan tanggal baru.</p>` },
    { id: "contact", icon: "mail", title: "Kontak", html: `<p>Pertanyaan tentang privasi: {mail}</p>` },
  ],
},
ja: {
  name: "日本語", app: "スリド", title: "プライバシー ポリシー",
  date: "アプリ「スリド」（Slid、パッケージ dev.slid）。2026年10月21日より施行。",
  lead: "スリドには独自のサーバー、アカウント、広告、分析機能がありません。タイムラインはお使いのスマートフォンの中にあり、開発者がそれを受け取ったり見たりすることはありません。",
  cards: [
    ["phone", "スマートフォンの中だけに", "タイムライン、場所、写真の位置情報はデバイスにのみ保存されます。"],
    ["off", "あなたに関する情報は送信されません", "アカウントも、トラッキングも、広告も、分析もありません。"],
    ["hand", "決めるのはあなた", "すべての権限とオンライン機能は任意で、いつでもオフにできます。"],
    ["trash", "簡単に削除", "記録はいつでも削除できます。アプリをアンインストールすればすべて消えます。"],
  ],
  toc: "このページの内容", optional: "任意",
  sections: [
    { id: "data", icon: "pin", title: "アプリが保持するデータ", html: `<ul>
<li><b>位置情報。</b>記録をオンにしている間、アプリはスマートフォンの位置情報を（バックグラウンドでも）記録し、訪れた場所と移動手段を表示します。</li>
<li><b>身体活動。</b>許可すると、Android が歩行中、自転車、乗り物での移動のいずれかをアプリに伝えます。これは移動手段の判定にのみ使われます。</li>
<li><b>写真と動画。</b>許可すると、アプリはギャラリーのファイルに保存された日付と場所を読み取り、写真を地図上に表示します。画像がコピーされたり、どこかに送信されたりすることはありません。アプリが写真に何かを書き込むことはなく、以前のバージョンが書き込んだ場所を、Android の確認を経て削除できるだけです。</li>
<li><b>インポートしたファイル。</b>選択した Google タイムラインや Google Takeout のファイルは、スマートフォン上で読み取られます。</li>
<li><b>場所と設定：</b>場所に付けた名前、言語、テーマ。</li>
</ul><p>これらはすべてデバイスに保存されます。</p>` },
    { id: "internet", icon: "globe", title: "インターネット経由で送られるもの", html: `<ul>
<li><b>地図。</b>地図タイルは OpenFreeMap（OpenStreetMap のデータ）から、航空写真は Esri から読み込まれます。これらのサーバーには表示中の地域はわかりますが、あなたが誰かはわかりません。</li>
<li><b>住所と場所の名前</b> <span class="opt">{opt}</span>。立ち寄った場所の座標は、住所と名前を取得するために Android の住所サービスと Nominatim（OpenStreetMap）に送られます。あなたを特定できる情報は一緒に送られません。設定でオフにできます。</li>
<li><b>公共交通機関</b> <span class="opt">{opt}</span>。バス、路面電車、電車、地下鉄を見分けるため、終了した乗り物での移動のルートを OpenStreetMap の Overpass サービスに送信し、ルート沿いの線路と停留所を受け取ります。あなたを特定できる情報は一緒に送られません。設定でオフにできます。</li>
</ul>` },
    { id: "drive", icon: "cloud", title: "Google ドライブ へのバックアップ", opt: true, html: `<p>Google ドライブ を接続すると、アプリはドライブ内の自身の非表示フォルダ（drive.appdata 権限）にのみアクセスでき、ほかのファイルは一切見えません。そこにタイムラインのコピーがデバイスごとに 1 つ保存され、新しいスマートフォンで復元したり、タブレットで表示したりできます。Google ドライブ はこのコピーの以前のバージョンをしばらく保持することがあり、アプリはそれを復元できます。また、接続中のアカウントを表示するためだけにメールアドレスを読み取ります。これらのデータはデバイスと Google の間でのみやり取りされ、開発者はアクセスできません。ドライブの接続は設定で解除できます。</p>
<p>Google API から受け取った情報のアプリによる使用は、Limited Use の要件を含め、Google API Services User Data Policy に準拠しています。</p>` },
    { id: "health", icon: "heart", title: "Health Connect を通じたウォッチのデータ", opt: true, html: `<p>許可すると、アプリは Mi Fitness などのウォッチ アプリが Health Connect に書き込んだ歩数、心拍数、睡眠、ワークアウト（ルート付き）を読み取ります。読み取るだけで、Health Connect に書き込むことはありません。データはスマートフォン上で読み取られ、「健康」タブとタイムラインの該当する日に表示するためだけに使われます。アプリはこれをデータベースに保存せず、バックアップにも含めず、どこにも送信しません。権限は Health Connect の設定でいつでも取り消せます。</p>` },
    { id: "files", icon: "file", title: "バックアップ ファイルと安全用のコピー", html: `<p>バックアップ ファイルは、あなたが自分で保存したときに、選んだ場所にだけ作成されます。バックアップでタイムラインを置き換える前に、アプリは以前のタイムラインをデバイスに保管します（最新の 3 つ）。誤って復元しても元に戻せます。これらのコピーがスマートフォンの外に出ることはありません。</p>` },
    { id: "delete", icon: "trash", title: "データの削除", html: `<p>タイムラインのどの記録も削除できます。アプリをアンインストールすると、デバイス上のデータはすべて消えます。Google ドライブ 上のコピーは、アプリ内か、Google ドライブ の設定の「アプリの管理」で削除できます。</p>` },
    { id: "children", icon: "child", title: "お子様について", html: `<p>アプリはお子様を含め、誰のデータも収集しません。すべては所有者のデバイスに残ります。</p>` },
    { id: "changes", icon: "edit", title: "変更", html: `<p>このポリシーが変更された場合は、新しい日付とともにこのページに新しい版を掲載します。</p>` },
    { id: "contact", icon: "mail", title: "お問い合わせ", html: `<p>プライバシーに関するご質問：{mail}</p>` },
  ],
},
kk: {
  name: "Қазақша", app: "Слід", title: "Құпиялық саясаты",
  date: "«Слід» қолданбасы (Slid, dev.slid бумасы). 2026 жылғы 21 қазаннан бастап күшінде.",
  lead: "Слід-тің өз серверлері, аккаунттары, жарнамасы мен аналитикасы жоқ. Хронологияңыз телефоныңызда тұрады, әзірлеуші оны ешқашан алмайды және көрмейді.",
  cards: [
    ["phone", "Телефоныңызда қалады", "Хронология, орындар және фото орындары тек құрылғыда сақталады."],
    ["off", "Сіз туралы ештеңе жіберілмейді", "Аккаунт та, бақылау да, жарнама да, аналитика да жоқ."],
    ["hand", "Шешім сізде", "Әр рұқсат пен әр онлайн функция міндетті емес, оларды өшіруге болады."],
    ["trash", "Оңай жойылады", "Кез келген жазбаны жойыңыз немесе қолданбаны өшіріңіз — бәрі жоғалады."],
  ],
  toc: "Осы бетте", optional: "міндетті емес",
  sections: [
    { id: "data", icon: "pin", title: "Қолданбада қандай деректер бар", html: `<ul>
<li><b>Орналасу.</b> Жазу қосулы тұрғанда қолданба телефонның орналасуын (фонда да) жазып отырады, сонда қайда болғаныңыз бен қалай жүргеніңіз көрінеді.</li>
<li><b>Физикалық белсенділік.</b> Рұқсат етсеңіз, Android қолданбаға жаяу жүріп келе жатқаныңызды, велосипедпен немесе көлікпен келе жатқаныңызды айтады. Бұл тек жүру тәсілін анықтау үшін қолданылады.</li>
<li><b>Фото мен бейне.</b> Рұқсат етсеңіз, қолданба фотоларды картада көрсету үшін галерея файлдарындағы күн мен орынды оқиды. Суреттердің өзі көшірілмейді және ешқайда жіберілмейді. Қолданба фотоларыңызға ештеңе жазбайды; ол Android сұрағаннан кейін тек ескі нұсқа жазған орынды алып тастай алады.</li>
<li><b>Импортталған файлдар.</b> Сіз таңдаған Google хронологиясы немесе Google Takeout файлдары телефонда оқылады.</li>
<li><b>Орындар мен баптаулар:</b> орындарға берген атауларыңыз, тіл, тақырып.</li>
</ul><p>Мұның бәрі құрылғыңызда сақталады.</p>` },
    { id: "internet", icon: "globe", title: "Интернет арқылы не жіберіледі", html: `<ul>
<li><b>Карталар.</b> Карта бөліктері OpenFreeMap-тен (OpenStreetMap деректері), жерсерік суреттері Esri-ден жүктеледі. Бұл серверлер қай аумақ көрсетілгенін көреді, бірақ сіздің кім екеніңізді көрмейді.</li>
<li><b>Мекенжайлар мен орын атаулары</b> <span class="opt">{opt}</span>. Тоқтаған орындарыңыздың координаттары мекенжай мен атау алу үшін Android мекенжай қызметіне және Nominatim-ге (OpenStreetMap) жіберіледі. Олармен бірге сізді анықтайтын ештеңе жіберілмейді. Мұны баптауларда өшіруге болады.</li>
<li><b>Қоғамдық көлік</b> <span class="opt">{opt}</span>. Автобусты, трамвайды, пойызды не метроны ажырату үшін аяқталған көлік сапарының бағыты OpenStreetMap-тің Overpass қызметіне жіберіледі, ол бағыт бойындағы жолдар мен аялдамаларды қайтарады. Онымен бірге сізді анықтайтын ештеңе жіберілмейді. Мұны баптауларда өшіруге болады.</li>
</ul>` },
    { id: "drive", icon: "cloud", title: "Google Drive-қа көшірме", opt: true, html: `<p>Google Drive-ты қоссаңыз, қолданба Drive-тағы тек өзінің жасырын қалтасына қол жеткізеді (drive.appdata рұқсаты) және басқа файлдарыңыздың ешқайсысын көрмейді. Онда хронологияның көшірмесі әр құрылғыға біреуден жазылады, оны жаңа телефонда қалпына келтіруге немесе планшетте көрсетуге болады. Google Drive бұл көшірменің ескі нұсқаларын біраз уақыт сақтауы мүмкін, қолданба оларды қалпына келтіре алады. Қолданба қай аккаунт қосылғанын көрсету үшін ғана электрондық пошта мекенжайыңызды да оқиды. Бұл деректер тек құрылғыңыз бен Google арасында жүреді; әзірлеушінің оларға қолжетімділігі жоқ. Drive-ты баптауларда ажыратуға болады.</p>
<p>Қолданбаның Google API арқылы алынған ақпаратты пайдалануы Google API Services User Data Policy талаптарына, соның ішінде Limited Use талаптарына сай келеді.</p>` },
    { id: "health", icon: "heart", title: "Health Connect арқылы сағат деректері", opt: true, html: `<p>Рұқсат етсеңіз, қолданба Health Connect-тен қадамдарды, пульсті, ұйқыны және жаттығуларды (бағыттарымен) оқиды, оларды Mi Fitness сияқты сағат қолданбалары жазады. Ол бұл деректерді тек оқиды және Health Connect-ке ешқашан жазбайды. Деректер телефонда тек «Денсаулық» қойындысында және хронологияның тиісті күнінде көрсету үшін оқылады; қолданба оларды өз дерекқорында сақтамайды, көшірмелерге қоспайды және ешқайда жібермейді. Рұқсаттарды кез келген уақытта Health Connect баптауларында қайтарып алуға болады.</p>` },

startPage(T, "privacy", (l, t, brand) => {
  document.title = `${brand} — ${t.title}`;
  const fill = s => s.replaceAll("{opt}", t.optional).replaceAll("{mail}", MAIL);
  const promises = t.cards.map(([i, b, s]) => `<div class="card tile"><div class="ic good">${icon(i)}</div><div><b>${b}</b><span>${s}</span></div></div>`).join("");
  const toc = t.sections.map(s => `<li><a href="#${s.id}"><span class="ic hot">${icon(s.icon)}</span><span class="t">${s.title}</span><span class="go">${icon("right")}</span></a></li>`).join("");
  const body = t.sections.map(s =>
    `<section class="card" id="${s.id}"><h2><span class="ic hot">${icon(s.icon)}</span><span>${s.title}${s.opt ? ` <span class="opt">${t.optional}</span>` : ""}</span></h2>${fill(s.html)}<a class="back" href="#toc">${icon("up")}${t.toc}</a></section>`,
  ).join("");
  document.getElementById("page").innerHTML =
    `<h1>${t.title}</h1><p class="date">${t.date}</p><p class="lead">${t.lead}</p>` +
    `<div class="grid promises">${promises}</div>` +
    `<nav class="card toc" id="toc" aria-label="${t.toc}"><h2>${t.toc}</h2><ol>${toc}</ol></nav>${body}` +
    `<footer>${brand} · ${MAIL}</footer>`;
  // Old links (#health-en, #en) still land in the right place.
  const h = location.hash.replace("-en", "");
  if (h && h !== "#en" && h !== "#") document.querySelector(h)?.scrollIntoView();
});
