  <rect width="512" height="512" rx="112" fill="#0f1622"/>
  <g stroke-width="10" stroke-linejoin="round">
    <use href="#c" x="192" y="145" fill="#5b95f0" stroke="#5b95f0"/>
    <use href="#c" x="128" y="256" fill="#5b95f0" stroke="#5b95f0"/>
    <use href="#c" x="192" y="367" fill="#5b95f0" stroke="#5b95f0"/>
    <use href="#c" x="320" y="145" fill="#ef6a5e" stroke="#ef6a5e"/>
