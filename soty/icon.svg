<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- SOTY: Honeycomb Kingdoms — the app icon (S-14, variant 3 of brand/variants.html, chosen 12.11.2026).
       Blue cells on the left, red on the right, the golden capital with a dark banner between them. Drawn by hand, our own work.
       Cells: pointy-top hexagons, circumradius 61 + a 10 px stroke of the same colour (rounded corners); neighbours 128 apart.
       brand/mark.svg is the same drawing without the dark tile. After a change: npm run icons. -->
