<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <!-- Chronometer's icon: a neon stopwatch whose glowing arc is almost full — all the time, counted. -->
  <defs>
    <radialGradient id="bg" cx="54" cy="48" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B1C63"/><stop offset=".55" stop-color="#120D2B"/><stop offset="1" stop-color="#06060E"/>
    </radialGradient>
    <radialGradient id="glowM" cx="86" cy="92" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity=".35"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="20" cy="18" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".25"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dial" cx="50" cy="52" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241A52"/><stop offset="1" stop-color="#0C0A1E"/>
    </radialGradient>
    <linearGradient id="ring" x1="34" y1="38" x2="74" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#8A5CFF"/><stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="arc" x1="62" y1="42" x2="40" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/><stop offset=".55" stop-color="#8A5CFF"/><stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="crown" x1="54" y1="22" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FF4FF"/><stop offset="1" stop-color="#00B8D9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect width="108" height="108" fill="url(#glowM)"/>
  <rect width="108" height="108" fill="url(#glowC)"/>

  <g transform="translate(0 1.5)">
  <!-- glow under the ring and the arc -->
  <circle cx="54" cy="58" r="22" fill="none" stroke="url(#ring)" stroke-width="7" opacity=".55" filter="url(#blur)"/>
  <path d="M54,42 A16,16 0 1,1 40.14,50" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round" opacity=".7" filter="url(#blur)"/>

  <!-- crown and side button -->
  <rect x="51.5" y="28" width="5" height="5" rx="1.2" fill="#00B8D9"/>
  <rect x="47" y="22.5" width="14" height="6.5" rx="3.2" fill="url(#crown)"/>
  <rect x="70.9" y="34.4" width="4.8" height="7.6" rx="1.8" fill="#B79CFF" transform="rotate(45 73.3 38.2)"/>

  <!-- dial, ring, track, progress arc -->
  <circle cx="54" cy="58" r="22" fill="url(#dial)"/>
  <circle cx="54" cy="58" r="22" fill="none" stroke="url(#ring)" stroke-width="4.5"/>
  <circle cx="54" cy="58" r="16" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="3.2"/>
  <path d="M54,42 A16,16 0 1,1 40.14,50" fill="none" stroke="url(#arc)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- hand to the end of the arc, its spark, the hub -->
  <path d="M54,58 L44.5,52.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40.14" cy="50" r="5" fill="#FF2BD6" opacity=".45" filter="url(#blur)"/>
  <circle cx="40.14" cy="50" r="2.4" fill="#FFFFFF"/>
  <circle cx="54" cy="58" r="3.4" fill="#FF2BD6"/>
  <circle cx="54" cy="58" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
